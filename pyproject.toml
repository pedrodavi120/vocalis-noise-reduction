[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalis"
version = "1.0.0"
description = "AI-Powered Noise Reduction Studio & Virtual Microphone"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pedro Davi (CEO, Void Studio)", email = "pedrodavi120@gmail.com" },
]
maintainers = [
    { name = "Void Studio", email = "contato@voidstudio.com.br" }
]
urls = { "Homepage" = "https://www.voidstudio.com.br", "Repository" = "https://github.com/pedrodavi120/vocalis-noise-reduction" }
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "noisereduce>=3.0.2",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[project.scripts]
vocalis = "vocalis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
