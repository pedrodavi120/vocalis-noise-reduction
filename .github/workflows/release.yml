name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller vocalis.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocalis-windows-x64
          path: dist/vocalis.exe

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libjack-jackd2-0 binutils

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Executable with PyInstaller
        run: |
          pyinstaller vocalis.spec

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocalis-linux-x64
          path: dist/vocalis

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: vocalis-windows-x64
          path: release-assets/windows

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: vocalis-linux-x64
          path: release-assets/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/vocalis.exe
            release-assets/linux/vocalis
          draft: false
          prerelease: false
          generate_release_notes: true
